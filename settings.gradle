pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'minimal-java-accounting'

include 'shared', 'core', 'application', 'observability'
include 'ports.api', 'ports.persistence', 'ports.messaging'
include 'adapters.api.console'
include 'adapters.api.http'
include 'adapters.persistence.in-memory', 'adapters.messaging.in-memory'
include 'adapters.persistence.postgresql'
include 'adapters.messaging.postgresql'
include 'adapters.messaging.artemis'
include 'app'

project(':ports.api').projectDir = file('ports/api')
project(':ports.persistence').projectDir = file('ports/persistence')
project(':ports.messaging').projectDir = file('ports/messaging')
project(':adapters.api.console').projectDir = file('adapters/api/console')
project(':adapters.api.http').projectDir = file('adapters/api/http')
project(':adapters.persistence.in-memory').projectDir =
        file('adapters/persistence/in-memory')
project(':adapters.persistence.postgresql').projectDir =
        file('adapters/persistence/postgresql')
project(':adapters.messaging.postgresql').projectDir =
        file('adapters/messaging/postgresql')
project(':adapters.messaging.artemis').projectDir =
        file('adapters/messaging/artemis')
project(':adapters.messaging.in-memory').projectDir =
        file('adapters/messaging/in-memory')
