<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1615" viewBox="0 0 2500 1615" role="img" aria-labelledby="title description">
  <title id="title">Minimal Java Accounting — logical ports, adapters, and resources</title>
  <desc id="description">Two-axis ports and adapters diagram showing the durable outbox messaging adapter using PostgreSQL and Artemis, and the PostgreSQL repository adapter depending on the accounting model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <marker id="implementation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" stroke="#263238" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .layer-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.6px; fill: #65747b; }
      .module { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; text-anchor: middle; }
      .package { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #526168; text-anchor: middle; }
      .note { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .band { stroke-width: 1.5; stroke-dasharray: 7 9; rx: 18; }
      .node { stroke-width: 2.5; rx: 14; filter: url(#shadow); }
      .logical-node { stroke-dasharray: 10 7; filter: none; }
      .edge { fill: none; stroke: #263238; stroke-width: 3; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .implementation-edge { marker-end: url(#implementation-arrow); }
      .resource-body, .resource-cap { fill: #eceff1; stroke: #65747b; stroke-width: 2.5; }
      .resource-body { filter: url(#shadow); }
      .resource-label { font-size: 17px; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="2500" height="1615"/>
  <text class="title" x="55" y="58">Minimal Java Accounting — logical ports, adapters, and resources</text>
  <text class="subtitle" x="55" y="91">One selected adapter per logical port · shared technical support stays neutral · external systems are cylinders</text>

  <rect class="band" x="290" y="100" width="1900" height="150" fill="#fff8f5" stroke="#e7b5a8"/>
  <text class="layer-label" x="315" y="128">API ADAPTERS</text>
  <rect class="band" x="290" y="295" width="1900" height="150" fill="#f4f8ff" stroke="#a9c7e8"/>
  <text class="layer-label" x="315" y="323">LOGICAL API PORT</text>
  <rect class="band" x="290" y="490" width="1900" height="235" fill="#fffaf0" stroke="#dbc88f"/>
  <text class="layer-label" x="315" y="518">CORE</text>
  <rect class="band" x="290" y="790" width="1900" height="175" fill="#f8f5ff" stroke="#c8b9e8"/>
  <text class="layer-label" x="315" y="818">LOGICAL INFRASTRUCTURE PORTS</text>
  <rect class="band" x="290" y="1040" width="1900" height="190" fill="#f2fbf5" stroke="#acd7b9"/>
  <text class="layer-label" x="315" y="1068">INFRASTRUCTURE ADAPTERS</text>
  <rect class="band" x="290" y="1300" width="1900" height="180" fill="#f7f8f9" stroke="#c4cdd1"/>
  <text class="layer-label" x="315" y="1328">EXTERNAL SYSTEMS</text>
  <path class="edge" d="M 145 660 L 145 700"/>
  <path class="edge" d="M 1300 225 L 1300 335"/>
  <path class="edge" d="M 1065 610 L 1250 610"/>
  <path class="edge" d="M 700 685 L 700 835"/>
  <path class="edge" d="M 950 685 L 950 770 L 1450 770 L 1450 835"/>
  <path class="edge" d="M 805 1185 L 805 1350"/>
  <path class="edge" d="M 1080 1185 L 1080 1260 L 1400 1260 L 1400 1387.5 L 1440 1387.5"/>
  <path class="edge" d="M 1525 1185 L 1525 1305"/>
  <path class="edge" d="M 1830 1117 L 1920 1117 L 1920 610 L 1750 610"/>
  <path class="edge implementation-edge" d="M 760 535 L 760 470 L 1150 470 L 1150 402"/>
  <path class="edge implementation-edge" d="M 805 1085 L 805 902"/>
  <path class="edge implementation-edge" d="M 1525 1085 L 1525 902"/>

  <g>
    <title>app — composition root</title>
    <rect class="node" x="35" y="560" width="220" height="100" fill="#f3f5f6" stroke="#65747b"/>
    <text class="module" x="145" y="604">app</text>
    <text class="package" x="145" y="633">d.m.app</text>
  </g>
  <g>
    <title>infrastructure — boundary decorators and runtime signals</title>
    <rect class="node" x="35" y="700" width="220" height="150" fill="#f3f5f6" stroke="#65747b"/>
    <text class="module" x="145" y="769">infrastructure</text>
    <text class="package" x="145" y="798">d.m.infrastructure</text>
  </g>
  <g>
    <title>adapters.api.http — HTTP and JSON translation</title>
    <rect class="node" x="1080" y="125" width="440" height="100" fill="#fff0eb" stroke="#c65b43"/>
    <text class="module" x="1300" y="169">adapters.api.http</text>
    <text class="package" x="1300" y="198">d.m.adapters.api.http</text>
  </g>
  <g>
    <title>api — logical inbound API port</title>
    <rect class="node logical-node" x="1090" y="335" width="420" height="67" fill="#eaf3ff" stroke="#3978b8"/>
    <text class="module" x="1300" y="362.5">api</text>
    <text class="package" x="1300" y="391.5">Handler&lt;SubmitTransaction&gt;</text>
  </g>
  <g>
    <title>application — use cases and handlers</title>
    <rect class="node" x="545" y="535" width="520" height="150" fill="#fff3cd" stroke="#a97900"/>
    <text class="module" x="805" y="604">application</text>
    <text class="package" x="805" y="633">d.m.application</text>
  </g>
  <g>
    <title>model — aggregates and process manager</title>
    <rect class="node" x="1250" y="535" width="500" height="150" fill="#fff3cd" stroke="#a97900"/>
    <text class="module" x="1500" y="604">model</text>
    <text class="package" x="1500" y="633">d.m.model</text>
  </g>
  <g>
    <title>messaging — logical messaging ports</title>
    <rect class="node logical-node" x="480" y="835" width="650" height="67" fill="#efeaff" stroke="#7157b5"/>
    <text class="module" x="805" y="862.5">messaging</text>
    <text class="package" x="805" y="891.5">Sender&lt;T&gt; · Receiver&lt;T&gt; · Handler&lt;T&gt;</text>
  </g>
  <g>
    <title>persistence — logical persistence ports</title>
    <rect class="node logical-node" x="1200" y="835" width="650" height="67" fill="#efeaff" stroke="#7157b5"/>
    <text class="module" x="1525" y="862.5">persistence</text>
    <text class="package" x="1525" y="891.5">Repository&lt;Identifier, Aggregate&gt; · TransactionBoundary</text>
  </g>
  <g>
    <title>shared.ports — generic port contracts</title>
    <rect class="node" x="2220" y="835" width="240" height="100" fill="#f3f5f6" stroke="#65747b"/>
    <text class="module" x="2340" y="879">shared.ports</text>
    <text class="package" x="2340" y="908">d.m.shared.ports</text>
  </g>
  <g>
    <title>adapters.messaging.outbox — PostgreSQL outbox to Artemis</title>
    <rect class="node" x="480" y="1085" width="650" height="100" fill="#eaf8ee" stroke="#3e8b58"/>
    <text class="module" x="805" y="1129">adapters.messaging.outbox</text>
    <text class="package" x="805" y="1158">d.m.adapters.messaging.outbox</text>
  </g>
  <g>
    <title>adapters.persistence.postgresql — plain JDBC repositories</title>
    <rect class="node" x="1220" y="1085" width="610" height="100" fill="#eaf8ee" stroke="#3e8b58"/>
    <text class="module" x="1525" y="1129">adapters.persistence.postgresql</text>
    <text class="package" x="1525" y="1158">d.m.adapters.persistence.postgresql</text>
  </g>
  <g>
    <title>shared.adapters.postgresql — shared JDBC transactions and migrations</title>
    <rect class="node" x="1985" y="1085" width="475" height="100" fill="#f3f5f6" stroke="#65747b"/>
    <text class="module" x="2222.5" y="1129">shared.adapters.postgresql</text>
    <text class="package" x="2222.5" y="1158">d.m.shared.adapters.postgresql</text>
  </g>

  <g>
    <title>Apache Artemis — external broker</title>
    <rect class="resource-body" x="574" y="1350" width="452" height="70"/>
    <ellipse class="resource-cap" cx="574" cy="1385" rx="24" ry="35"/>
    <ellipse class="resource-cap" cx="1026" cy="1385" rx="24" ry="35"/>
    <text class="module" x="800" y="1391">Apache Artemis · broker</text>
  </g>
  <g>
    <title>PostgreSQL — external database</title>
    <rect class="resource-body" x="1440" y="1325" width="170" height="125"/>
    <ellipse class="resource-cap" cx="1525" cy="1325" rx="85" ry="20"/>
    <ellipse class="resource-cap" cx="1525" cy="1450" rx="85" ry="20"/>
    <text class="module resource-label" x="1525" y="1384.5">PostgreSQL</text>
    <text class="package" x="1525" y="1410.5">database</text>
  </g>
  <line x1="55" y1="1530" x2="2445" y2="1530" stroke="#d7dee1" stroke-width="1.5"/>
  <text class="note" x="55" y="1568">Solid boxes are Gradle modules; dashed boxes are logical typed ports; cylinders are independently deployed external systems.</text>
  <text class="note" x="55" y="1595">Hollow triangles mean implements; filled arrows mean uses or depends on. Logical ports are 67 units high. d.m. = dev.minimalaccounting.</text>
</svg>
