<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300" role="img" aria-labelledby="title description">
  <title id="title">Minimal Java Accounting module architecture</title>
  <desc id="description">Two-axis ports and adapters diagram pairing each Gradle module with its Java package root, with adapter height 100, port height 67, and core height 150.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .layer-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.6px; fill: #65747b; }
      .module { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; text-anchor: middle; }
      .package { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #526168; text-anchor: middle; }
      .note { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .band { stroke-width: 1.5; stroke-dasharray: 7 9; rx: 18; }
      .node { stroke-width: 2.5; rx: 14; filter: url(#shadow); }
      .edge { fill: none; stroke: #263238; stroke-width: 3.25; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="2000" height="1300"/>
  <text class="title" x="55" y="58">Minimal Java Accounting — ports and adapters</text>
  <text class="subtitle" x="55" y="91">Composition left · shared foundation right · API at top · infrastructure at bottom</text>

  <rect class="band" x="320" y="105" width="1370" height="150" fill="#fff8f5" stroke="#e7b5a8"/>
  <text class="layer-label" x="345" y="133">API ADAPTER</text>
  <rect class="band" x="320" y="295" width="1370" height="155" fill="#f4f8ff" stroke="#a9c7e8"/>
  <text class="layer-label" x="345" y="323">API PORT</text>
  <rect class="band" x="320" y="495" width="1370" height="230" fill="#fffaf0" stroke="#dbc88f"/>
  <text class="layer-label" x="345" y="523">CORE</text>
  <rect class="band" x="320" y="775" width="1370" height="175" fill="#f8f5ff" stroke="#c8b9e8"/>
  <text class="layer-label" x="345" y="803">INFRASTRUCTURE PORTS</text>
  <rect class="band" x="320" y="1015" width="1370" height="180" fill="#f2fbf5" stroke="#acd7b9"/>
  <text class="layer-label" x="345" y="1043">INFRASTRUCTURE ADAPTERS</text>
  <path class="edge" d="M 1010 230 L 1010 340"/>
  <path class="edge" d="M 750 540 L 750 470 L 900 470 L 900 407"/>
  <path class="edge" d="M 1195 373.5 L 1640 373.5 L 1640 485 L 1850 485 L 1850 565"/>
  <path class="edge" d="M 940 615 L 1070 615"/>
  <path class="edge" d="M 1400 615 L 1740 615"/>
  <path class="edge" d="M 680 690 L 680 825"/>
  <path class="edge" d="M 830 690 L 830 755 L 1335 755 L 1335 825"/>
  <path class="edge" d="M 910 858.5 C 1020 785 1080 735 1170 690"/>
  <path class="edge" d="M 660 1065 L 675 892"/>
  <path class="edge" d="M 930 1090 C 1010 970 1000 800 1195 690"/>
  <path class="edge" d="M 1340 1065 L 1335 892"/>

  <g>
    <title>app — composition root</title>
  <rect class="node" x="45" y="565" width="220" height="100" fill="#f3f5f6" stroke="#65747b"/>
  <text class="module" x="155" y="609">app</text>
  <text class="package" x="155" y="638">d.m.app</text>
  </g>
  <g>
    <title>shared — common values</title>
  <rect class="node" x="1740" y="565" width="220" height="100" fill="#f3f5f6" stroke="#65747b"/>
  <text class="module" x="1850" y="609">shared</text>
  <text class="package" x="1850" y="638">d.m.shared</text>
  </g>
  <g>
    <title>adapters.api.console — command-line translation</title>
  <rect class="node" x="760" y="130" width="500" height="100" fill="#fff0eb" stroke="#c65b43"/>
  <text class="module" x="1010" y="174">adapters.api.console</text>
  <text class="package" x="1010" y="203">d.m.adapters.api.console</text>
  </g>
  <g>
    <title>ports.api — TransactionProcessor</title>
  <rect class="node" x="825" y="340" width="370" height="67" fill="#eaf3ff" stroke="#3978b8"/>
  <text class="module" x="1010" y="367.5">ports.api</text>
  <text class="package" x="1010" y="396.5">d.m.ports.api</text>
  </g>
  <g>
    <title>application — use cases and workflows</title>
  <rect class="node" x="560" y="540" width="380" height="150" fill="#fff3cd" stroke="#a97900"/>
  <text class="module" x="750" y="609">application</text>
  <text class="package" x="750" y="638">d.m.application</text>
  </g>
  <g>
    <title>core — entities and rules</title>
  <rect class="node" x="1070" y="540" width="330" height="150" fill="#fff3cd" stroke="#a97900"/>
  <text class="module" x="1235" y="609">core</text>
  <text class="package" x="1235" y="638">d.m.core</text>
  </g>
  <g>
    <title>ports.persistence — repository contracts</title>
  <rect class="node" x="440" y="825" width="470" height="67" fill="#efeaff" stroke="#7157b5"/>
  <text class="module" x="675" y="852.5">ports.persistence</text>
  <text class="package" x="675" y="881.5">d.m.ports.persistence</text>
  </g>
  <g>
    <title>ports.messaging — send · receive · handle</title>
  <rect class="node" x="1100" y="825" width="470" height="67" fill="#efeaff" stroke="#7157b5"/>
  <text class="module" x="1335" y="852.5">ports.messaging</text>
  <text class="package" x="1335" y="881.5">d.m.ports.messaging</text>
  </g>
  <g>
    <title>adapters.persistence.in-memory — ConcurrentHashMap repositories</title>
  <rect class="node" x="360" y="1065" width="600" height="100" fill="#eaf8ee" stroke="#3e8b58"/>
  <text class="module" x="660" y="1109">adapters.persistence.in-memory</text>
  <text class="package" x="660" y="1138">d.m.adapters.persistence.inmemory</text>
  </g>
  <g>
    <title>adapters.messaging.in-memory — queues, topics and pollers</title>
  <rect class="node" x="1040" y="1065" width="600" height="100" fill="#eaf8ee" stroke="#3e8b58"/>
  <text class="module" x="1340" y="1109">adapters.messaging.in-memory</text>
  <text class="package" x="1340" y="1138">d.m.adapters.messaging.inmemory</text>
  </g>
  <line x1="55" y1="1235" x2="1945" y2="1235" stroke="#d7dee1" stroke-width="1.5"/>
  <text class="note" x="55" y="1272">d.m. = dev.minimalaccounting; hyphens are omitted in Java. Adapter : port : core height = 100 : 67 : 150.</text>
</svg>
