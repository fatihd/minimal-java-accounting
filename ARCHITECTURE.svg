<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1375" viewBox="0 0 2500 1375" role="img" aria-labelledby="title description">
  <title id="title">Minimal Java Accounting — logical ports and adapters</title>
  <desc id="description">Two-axis ports and adapters diagram with dashed logical API, persistence, and messaging ports backed by generic contracts in the shared ports module.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <marker id="implementation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" stroke="#263238" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .layer-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.6px; fill: #65747b; }
      .module { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; text-anchor: middle; }
      .package { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #526168; text-anchor: middle; }
      .note { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .band { stroke-width: 1.5; stroke-dasharray: 7 9; rx: 18; }
      .node { stroke-width: 2.5; rx: 14; filter: url(#shadow); }
      .logical-node { stroke-dasharray: 10 7; filter: none; }
      .edge { fill: none; stroke: #263238; stroke-width: 3; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .implementation-edge { marker-end: url(#implementation-arrow); }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="2500" height="1375"/>
  <text class="title" x="55" y="58">Minimal Java Accounting — logical ports and adapters</text>
  <text class="subtitle" x="55" y="91">Dashed logical ports · generic contracts in shared.ports · Gradle modules remain solid</text>

  <rect class="band" x="290" y="105" width="1920" height="150" fill="#fff8f5" stroke="#e7b5a8"/>
  <text class="layer-label" x="315" y="133">API ADAPTERS</text>
  <rect class="band" x="290" y="295" width="1920" height="155" fill="#f4f8ff" stroke="#a9c7e8"/>
  <text class="layer-label" x="315" y="323">LOGICAL API PORT</text>
  <rect class="band" x="290" y="490" width="1920" height="235" fill="#fffaf0" stroke="#dbc88f"/>
  <text class="layer-label" x="315" y="518">CORE</text>
  <rect class="band" x="290" y="790" width="1920" height="175" fill="#f8f5ff" stroke="#c8b9e8"/>
  <text class="layer-label" x="315" y="818">LOGICAL INFRASTRUCTURE PORTS</text>
  <rect class="band" x="290" y="1040" width="1920" height="200" fill="#f2fbf5" stroke="#acd7b9"/>
  <text class="layer-label" x="315" y="1068">INFRASTRUCTURE ADAPTERS</text>
  <path class="edge" d="M 145 685 L 145 715"/>
  <path class="edge" d="M 1250 230 L 1250 340"/>
  <path class="edge" d="M 930 610 L 1040 610"/>
  <path class="edge" d="M 650 685 L 650 770 L 690 770 L 690 835"/>
  <path class="edge" d="M 850 685 L 850 750 L 1450 750 L 1450 835"/>
  <path class="edge" d="M 1080 1140 L 1275 1140"/>
  <path class="edge implementation-edge" d="M 650 535 L 650 470 L 1100 470 L 1100 407"/>
  <path class="edge implementation-edge" d="M 535 1090 L 550 902"/>
  <path class="edge implementation-edge" d="M 905 1090 L 900 902"/>
  <path class="edge implementation-edge" d="M 1450 1090 L 1450 902"/>

  <g>
    <title>app — composition root</title>
    <rect class="node" x="35" y="585" width="220" height="100" fill="#f3f5f6" stroke="#65747b"/>
    <text class="module" x="145" y="629">app</text>
    <text class="package" x="145" y="658">d.m.app</text>
  </g>
  <g>
    <title>infrastructure — boundary decorators and runtime signals</title>
    <rect class="node" x="35" y="715" width="220" height="150" fill="#f3f5f6" stroke="#65747b"/>
    <text class="module" x="145" y="784">infrastructure</text>
    <text class="package" x="145" y="813">d.m.infrastructure</text>
  </g>
  <g>
    <title>adapters.api.http — HTTP and JSON translation</title>
    <rect class="node" x="1000" y="130" width="500" height="100" fill="#fff0eb" stroke="#c65b43"/>
    <text class="module" x="1250" y="174">adapters.api.http</text>
    <text class="package" x="1250" y="203">d.m.adapters.api.http</text>
  </g>
  <g>
    <title>application — use cases and handlers</title>
    <rect class="node" x="480" y="535" width="450" height="150" fill="#fff3cd" stroke="#a97900"/>
    <text class="module" x="705" y="604">application</text>
    <text class="package" x="705" y="633">d.m.application</text>
  </g>
  <g>
    <title>model — aggregates and process manager</title>
    <rect class="node" x="1040" y="535" width="420" height="150" fill="#fff3cd" stroke="#a97900"/>
    <text class="module" x="1250" y="604">model</text>
    <text class="package" x="1250" y="633">d.m.model</text>
  </g>
  <g>
    <title>adapters.messaging.artemis — durable queues and topics</title>
    <rect class="node" x="360" y="1090" width="350" height="100" fill="#eaf8ee" stroke="#3e8b58"/>
    <text class="module" x="535" y="1134">adapters.messaging.artemis</text>
    <text class="package" x="535" y="1163">d.m.adapters.messaging.artemis</text>
  </g>
  <g>
    <title>adapters.messaging.postgresql — transactional outbox</title>
    <rect class="node" x="730" y="1090" width="350" height="100" fill="#eaf8ee" stroke="#3e8b58"/>
    <text class="module" x="905" y="1134">adapters.messaging.postgresql</text>
    <text class="package" x="905" y="1163">d.m.adapters.messaging.postgresql</text>
  </g>
  <g>
    <title>adapters.persistence.postgresql — plain JDBC repositories</title>
    <rect class="node" x="1275" y="1090" width="350" height="100" fill="#eaf8ee" stroke="#3e8b58"/>
    <text class="module" x="1450" y="1134">adapters.persistence.postgresql</text>
    <text class="package" x="1450" y="1163">d.m.adapters.persistence.postgresql</text>
  </g>
  <g>
    <title>api — logical inbound API port</title>
    <rect class="node logical-node" x="1040" y="340" width="420" height="67" fill="#eaf3ff" stroke="#3978b8"/>
    <text class="module" x="1250" y="367.5">api</text>
    <text class="package" x="1250" y="396.5">Handler&lt;SubmitTransaction&gt;</text>
  </g>
  <g>
    <title>messaging — logical messaging ports</title>
    <rect class="node logical-node" x="360" y="835" width="660" height="67" fill="#efeaff" stroke="#7157b5"/>
    <text class="module" x="690" y="862.5">messaging</text>
    <text class="package" x="690" y="891.5">Sender&lt;T&gt; · Receiver&lt;T&gt; · Handler&lt;T&gt;</text>
  </g>
  <g>
    <title>persistence — logical persistence ports</title>
    <rect class="node logical-node" x="1080" y="835" width="740" height="67" fill="#efeaff" stroke="#7157b5"/>
    <text class="module" x="1450" y="862.5">persistence</text>
    <text class="package" x="1450" y="891.5">Repository&lt;Identifier, Aggregate&gt; · TransactionBoundary</text>
  </g>
  <g>
    <title>shared.ports — generic port contracts</title>
    <rect class="node" x="2245" y="835" width="220" height="100" fill="#f3f5f6" stroke="#65747b"/>
    <text class="module" x="2355" y="879">shared.ports</text>
    <text class="package" x="2355" y="908">d.m.shared.ports</text>
  </g>
  <line x1="55" y1="1290" x2="2445" y2="1290" stroke="#d7dee1" stroke-width="1.5"/>
  <text class="note" x="55" y="1328">Solid boxes are Gradle modules; dashed boxes are logical typed ports backed by the generic contracts in shared.ports.</text>
  <text class="note" x="55" y="1355">Hollow triangles mean implements; filled arrows mean uses or depends on. Logical ports are 67 units high. d.m. = dev.minimalaccounting.</text>
</svg>
