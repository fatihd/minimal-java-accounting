<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="800" viewBox="0 0 1750 800" role="img" aria-labelledby="title description">
  <title id="title">AccountEffect lifecycle</title>
  <desc id="description">Transaction-owned child lifecycle; these package-private operations are invoked only through Transaction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .state { stroke-width: 2.5; rx: 16; filter: url(#shadow); }
      .terminal-border { fill: none; stroke: #65747b; stroke-width: 1.5; rx: 11; }
      .state-name { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172126; text-anchor: middle; }
      .state-caption { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; text-anchor: middle; }
      .edge { fill: none; stroke: #263238; stroke-width: 2.75; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .same-state { stroke-dasharray: 8 7; }
      .edge-label-background { fill: #ffffff; rx: 7; }
      .edge-label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; text-anchor: middle; }
      .initial { fill: #263238; }
      .initial-label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; text-anchor: middle; }
      .footer { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .legend-line { stroke: #263238; stroke-width: 2.75; }
      .legend-dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1750" height="800"/>
  <text class="title" x="50" y="54">AccountEffect lifecycle</text>
  <text class="subtitle" x="50" y="84">Transaction-owned child lifecycle; these package-private operations are invoked only through Transaction.</text>
  <g>
  <path class="edge" d="M 90 365 L 190 365"/>
  <rect class="edge-label-background" x="108" y="318" width="64" height="28"/>
  <text class="edge-label" x="140" y="335">start</text>
</g>
  <g>
  <path class="edge" d="M 400 365 L 530 365"/>
  <rect class="edge-label-background" x="437" y="323" width="56" height="28"/>
  <text class="edge-label" x="465" y="340">hold</text>
</g>
  <g>
  <path class="edge" d="M 340 410 C 390 535 450 615 530 615"/>
  <rect class="edge-label-background" x="370" y="523" width="80" height="28"/>
  <text class="edge-label" x="410" y="540">decline</text>
</g>
  <g>
  <path class="edge" d="M 360 320 C 500 125 710 115 900 185"/>
  <rect class="edge-label-background" x="552" y="108" width="136" height="48"/>
  <text class="edge-label" x="620" y="125">beginRelease</text>
<text class="edge-label" x="620" y="145">late placement</text>
</g>
  <g>
  <path class="edge" d="M 700 320 C 760 250 815 205 900 185"/>
  <rect class="edge-label-background" x="730" y="228" width="120" height="28"/>
  <text class="edge-label" x="790" y="245">beginRelease</text>
</g>
  <g>
  <path class="edge" d="M 740 380 C 800 420 835 460 900 480"/>
  <rect class="edge-label-background" x="738" y="413" width="144" height="28"/>
  <text class="edge-label" x="810" y="430">beginSettlement</text>
</g>
  <g>
  <path class="edge" d="M 1140 185 L 1350 185"/>
  <rect class="edge-label-background" x="1205" y="143" width="80" height="28"/>
  <text class="edge-label" x="1245" y="160">release</text>
</g>
  <g>
  <path class="edge" d="M 1140 480 L 1350 480"/>
  <rect class="edge-label-background" x="1209" y="438" width="72" height="28"/>
  <text class="edge-label" x="1245" y="455">settle</text>
</g>
  <g>
  <circle class="initial" cx="80" cy="365" r="10"/>
  <text class="initial-label" x="92" y="400">created by start</text>
</g>
  <g>
  <rect class="state" x="190" y="320" width="210" height="90" fill="#eaf3ff" stroke="#3978b8"/>
  <text class="state-name" x="295" y="372">PENDING</text>
</g>
  <g>
  <rect class="state" x="530" y="320" width="210" height="90" fill="#eaf3ff" stroke="#3978b8"/>
  <text class="state-name" x="635" y="372">HELD</text>
</g>
  <g>
  <rect class="state" x="530" y="570" width="210" height="90" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="536" y="576" width="198" height="78"/>
  <text class="state-name" x="635" y="622">DECLINED</text>
</g>
  <g>
  <rect class="state" x="900" y="135" width="240" height="100" fill="#eaf3ff" stroke="#3978b8"/>
  <text class="state-name" x="1020" y="177">RELEASING</text>
  <text class="state-caption" x="1020" y="210">repeat beginRelease</text>
</g>
  <g>
  <rect class="state" x="1350" y="135" width="230" height="100" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="1356" y="141" width="218" height="88"/>
  <text class="state-name" x="1465" y="177">RELEASED</text>
  <text class="state-caption" x="1465" y="210">repeat release</text>
</g>
  <g>
  <rect class="state" x="900" y="430" width="240" height="100" fill="#eaf3ff" stroke="#3978b8"/>
  <text class="state-name" x="1020" y="472">SETTLING</text>
  <text class="state-caption" x="1020" y="505">repeat beginSettlement</text>
</g>
  <g>
  <rect class="state" x="1350" y="430" width="230" height="100" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="1356" y="436" width="218" height="88"/>
  <text class="state-name" x="1465" y="472">SETTLED</text>
  <text class="state-caption" x="1465" y="505">repeat settle</text>
</g>
  <line x1="50" y1="738" x2="1700" y2="738" stroke="#d7dee1" stroke-width="1.5"/>
  <text class="footer" x="50" y="770">Terminal states have a double border. Captions show explicitly idempotent same-state operations.</text>
</svg>
