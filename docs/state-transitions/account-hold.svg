<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title description">
  <title id="title">AccountHold lifecycle</title>
  <desc id="description">Account-owned child lifecycle; Account is the public mutation boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .state { stroke-width: 2.5; rx: 16; filter: url(#shadow); }
      .terminal-border { fill: none; stroke: #65747b; stroke-width: 1.5; rx: 11; }
      .state-name { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172126; text-anchor: middle; }
      .state-caption { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; text-anchor: middle; }
      .edge { fill: none; stroke: #263238; stroke-width: 2.75; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .same-state { stroke-dasharray: 8 7; }
      .edge-label-background { fill: #ffffff; rx: 7; }
      .edge-label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; text-anchor: middle; }
      .initial { fill: #263238; }
      .initial-label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; text-anchor: middle; }
      .footer { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .legend-line { stroke: #263238; stroke-width: 2.75; }
      .legend-dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1600" height="700"/>
  <text class="title" x="50" y="54">AccountHold lifecycle</text>
  <text class="subtitle" x="50" y="84">Account-owned child lifecycle; Account is the public mutation boundary.</text>
  <g>
  <path class="edge" d="M 95 330 L 220 330"/>
  <rect class="edge-label-background" x="109" y="283" width="96" height="28"/>
  <text class="edge-label" x="157" y="300">placeHold</text>
</g>
  <g>
  <path class="edge" d="M 410 285 C 500 170 575 155 700 155"/>
  <rect class="edge-label-background" x="483" y="138" width="144" height="28"/>
  <text class="edge-label" x="555" y="155">decline(reason)</text>
</g>
  <g>
  <path class="edge" d="M 440 330 L 700 335"/>
  <rect class="edge-label-background" x="530" y="288" width="80" height="28"/>
  <text class="edge-label" x="570" y="305">release</text>
</g>
  <g>
  <path class="edge" d="M 410 375 C 500 485 575 515 700 515"/>
  <rect class="edge-label-background" x="519" y="483" width="72" height="28"/>
  <text class="edge-label" x="555" y="500">settle</text>
</g>
  <g>
  <circle class="initial" cx="85" cy="330" r="10"/>
  <text class="initial-label" x="85" y="365">new hold</text>
</g>
  <g>
  <rect class="state" x="220" y="285" width="220" height="90" fill="#eaf8ee" stroke="#3e8b58"/>
  <text class="state-name" x="330" y="337">HELD</text>
</g>
  <g>
  <rect class="state" x="700" y="105" width="250" height="100" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="706" y="111" width="238" height="88"/>
  <text class="state-name" x="825" y="147">DECLINED</text>
  <text class="state-caption" x="825" y="180">retains refusal reason</text>
</g>
  <g>
  <rect class="state" x="700" y="285" width="250" height="100" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="706" y="291" width="238" height="88"/>
  <text class="state-name" x="825" y="327">RELEASED</text>
  <text class="state-caption" x="825" y="360">repeat release</text>
</g>
  <g>
  <rect class="state" x="700" y="465" width="250" height="100" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="706" y="471" width="238" height="88"/>
  <text class="state-name" x="825" y="507">SETTLED</text>
  <text class="state-caption" x="825" y="540">repeat settle</text>
</g>
  <line x1="50" y1="638" x2="1550" y2="638" stroke="#d7dee1" stroke-width="1.5"/>
  <text class="footer" x="50" y="670">Duplicate placement is handled by Account without mutating the existing hold. Other invalid transitions throw.</text>
</svg>
