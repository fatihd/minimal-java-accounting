<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="920" viewBox="0 0 1900 920" role="img" aria-labelledby="title description">
  <title id="title">Transaction lifecycle</title>
  <desc id="description">Aggregate-root state changes; captions identify accepted operations that leave the state unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172126; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .state { stroke-width: 2.5; rx: 16; filter: url(#shadow); }
      .terminal-border { fill: none; stroke: #65747b; stroke-width: 1.5; rx: 11; }
      .state-name { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172126; text-anchor: middle; }
      .state-caption { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; text-anchor: middle; }
      .edge { fill: none; stroke: #263238; stroke-width: 2.75; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .same-state { stroke-dasharray: 8 7; }
      .edge-label-background { fill: #ffffff; rx: 7; }
      .edge-label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; text-anchor: middle; }
      .initial { fill: #263238; }
      .initial-label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; text-anchor: middle; }
      .footer { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526168; }
      .legend-line { stroke: #263238; stroke-width: 2.75; }
      .legend-dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1900" height="920"/>
  <text class="title" x="50" y="54">Transaction lifecycle</text>
  <text class="subtitle" x="50" y="84">Aggregate-root state changes; captions identify accepted operations that leave the state unchanged.</text>
  <g>
  <path class="edge" d="M 100 405 L 250 405"/>
  <rect class="edge-label-background" x="111" y="348" width="128" height="48"/>
  <text class="edge-label" x="175" y="365">start</text>
<text class="edge-label" x="175" y="385">effects exist</text>
</g>
  <g>
  <path class="edge" d="M 97 397 C 235 170 430 150 680 207"/>
  <rect class="edge-label-background" x="297" y="133" width="136" height="48"/>
  <text class="edge-label" x="365" y="150">start</text>
<text class="edge-label" x="365" y="170">no net effects</text>
</g>
  <g>
  <path class="edge" d="M 500 370 C 570 330 610 250 680 215"/>
  <rect class="edge-label-background" x="509" y="275" width="152" height="48"/>
  <text class="edge-label" x="585" y="292">placeEffect</text>
<text class="edge-label" x="585" y="312">all effects held</text>
</g>
  <g>
  <path class="edge" d="M 500 440 C 570 485 610 555 680 585"/>
  <rect class="edge-label-background" x="493" y="488" width="184" height="48"/>
  <text class="edge-label" x="585" y="505">declineEffect</text>
<text class="edge-label" x="585" y="525">release work remains</text>
</g>
  <g>
  <path class="edge" d="M 500 448 C 690 750 980 760 1175 620"/>
  <rect class="edge-label-background" x="733" y="725" width="184" height="48"/>
  <text class="edge-label" x="825" y="742">declineEffect</text>
<text class="edge-label" x="825" y="762">all effects finished</text>
</g>
  <g>
  <path class="edge" d="M 950 595 L 1175 595"/>
  <rect class="edge-label-background" x="934" y="533" width="256" height="48"/>
  <text class="edge-label" x="1062" y="550">releaseEffect / declineEffect</text>
<text class="edge-label" x="1062" y="570">all effects finished</text>
</g>
  <g>
  <path class="edge" d="M 915 215 L 1110 215"/>
  <rect class="edge-label-background" x="940" y="161" width="144" height="48"/>
  <text class="edge-label" x="1012" y="178">beginSettlement</text>
<text class="edge-label" x="1012" y="198">effects exist</text>
</g>
  <g>
  <path class="edge" d="M 880 160 C 1030 105 1385 105 1605 160"/>
  <rect class="edge-label-background" x="1168" y="103" width="144" height="48"/>
  <text class="edge-label" x="1240" y="120">beginSettlement</text>
<text class="edge-label" x="1240" y="140">no effects</text>
</g>
  <g>
  <path class="edge" d="M 1355 215 L 1530 215"/>
  <rect class="edge-label-background" x="1354" y="161" width="176" height="48"/>
  <text class="edge-label" x="1442" y="178">settleEffect</text>
<text class="edge-label" x="1442" y="198">all effects settled</text>
</g>
  <g>
  <circle class="initial" cx="90" cy="405" r="10"/>
  <text class="initial-label" x="90" y="440">state = null</text>
</g>
  <g>
  <rect class="state" x="250" y="350" width="250" height="110" fill="#fff3cd" stroke="#a97900"/>
  <text class="state-name" x="375" y="397">PLACING_HOLDS</text>
  <text class="state-caption" x="375" y="430">partial placeEffect</text>
</g>
  <g>
  <rect class="state" x="680" y="160" width="235" height="110" fill="#fff3cd" stroke="#a97900"/>
  <text class="state-name" x="797.5" y="207">HELD</text>
  <text class="state-caption" x="797.5" y="240">duplicate placed event</text>
</g>
  <g>
  <rect class="state" x="680" y="540" width="270" height="110" fill="#fff3cd" stroke="#a97900"/>
  <text class="state-name" x="815" y="587">RELEASING_HOLDS</text>
  <text class="state-caption" x="815" y="620">outcome progress · late place</text>
</g>
  <g>
  <rect class="state" x="1110" y="160" width="245" height="110" fill="#fff3cd" stroke="#a97900"/>
  <text class="state-name" x="1232.5" y="207">SETTLING</text>
  <text class="state-caption" x="1232.5" y="240">partial settle · repeat journal</text>
</g>
  <g>
  <rect class="state" x="1530" y="160" width="245" height="110" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="1536" y="166" width="233" height="98"/>
  <text class="state-name" x="1652.5" y="207">COMPLETED</text>
  <text class="state-caption" x="1652.5" y="240">stale place · repeat completion</text>
</g>
  <g>
  <rect class="state" x="1175" y="540" width="245" height="110" fill="#f3f5f6" stroke="#65747b"/>
  <rect class="terminal-border" x="1181" y="546" width="233" height="98"/>
  <text class="state-name" x="1297.5" y="587">REJECTED</text>
  <text class="state-caption" x="1297.5" y="620">duplicate decline</text>
</g>
  <line x1="50" y1="858" x2="1850" y2="858" stroke="#d7dee1" stroke-width="1.5"/>
  <text class="footer" x="50" y="890">Solid arrows change TransactionState. Full-state adapter reconstruction is not a business transition.</text>
</svg>
